[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-factory-pipeline-deterministic"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "jsonschema==4.23.0",
  "python-dotenv==1.0.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
